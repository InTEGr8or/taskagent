[project]
name = "task-agent"
version = "1.3.6"
description = "A prioritized, file-based task queue for autonomous agentic workers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mark Stouffer", email = "1802850+InTEGr8or@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "task-agent",
    "ai-agent",
    "multi-agent",
    "mcp",
    "model-context-protocol",
    "agentic-workflow",
    "claude-code",
    "antigravity",
    "opencode",
    "grok",
    "matrix-bridge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "mcp>=1.26.0,<2.0.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.2.2",
    "pyperclip>=1.9.0",
    "questionary>=2.1.1",
    "rich>=13.9.4",
    "githubkit>=0.15.5",
    "verkit>=0.1.4",
    "multi-agent-registry>=0.1.0",
    "transitions>=0.9.2",
    "boto3>=1.34.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/InTEGr8or/task-agent"
Repository = "https://github.com/InTEGr8or/task-agent.git"
Issues = "https://github.com/InTEGr8or/task-agent/issues"
Documentation = "https://github.com/InTEGr8or/task-agent/blob/main/README.md"


[project.scripts]
ta = "taskagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/taskagent"]
artifacts = ["sidecars/"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.7",
    "bump-my-version==1.2.7",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[tool.bumpversion]
current_version = "1.0.50"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
verkit = { path = "/home/mstouffer/repos/verkit" }
multi-agent-registry = { path = "/home/mstouffer/repos/multi-agent-registry" }


